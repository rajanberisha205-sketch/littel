<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="theme-color" content="#0a0a0c" id="themeColorMeta">
  
  <!-- SEO Meta Tags -->
  <title>Fast & Free Internet Speed Test | Fasqoo Lite</title>
  <meta name="description" content="Test your internet speed instantly with Fasqoo Lite. Accurate download, upload, ping, and jitter measurements powered by global edge CDNs.">
  <meta name="keywords" content="internet speed test, broadband speed test, wifi speed test, check internet speed, fasqoo lite, ping test, Fasqoo">
  <link rel="canonical" href="https://lite.fasqoo.com/">

  <!-- Open Graph / Social Media SEO -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://lite.fasqoo.com/">
  <meta property="og:title" content="Fast & Free Internet Speed Test | Fasqoo Lite">
  <meta property="og:description" content="Check your download speed, upload speed, and latency instantly with our lightweight internet speed test.">
  <meta property="og:image" content="https://lite.fasqoo.com/fasqoologo.png">

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root[data-theme="dark"] {
  --bg: #09090b;
  --card: rgba(24, 24, 27, 0.75);
  --card-border: rgba(255, 255, 255, 0.08);
  --text: #f4f4f5;
  --muted: #a1a1aa;
  --line: #27272a;
  --accent: #ef4444;
  --accent-glow: rgba(239, 68, 68, 0.15);
  --btn-bg: #f4f4f5;
  --btn-text: #09090b;
  --header-hover: rgba(255, 255, 255, 0.08);
  --progress-bg: rgba(255, 255, 255, 0.1);
}

:root[data-theme="light"] {
  --bg: #f8fafc;
  --card: rgba(255, 255, 255, 0.9);
  --card-border: rgba(0, 0, 0, 0.08);
  --text: #0f172a;
  --muted: #64748b;
  --line: #e2e8f0;
  --accent: #dc2626;
  --accent-glow: rgba(220, 38, 38, 0.1);
  --btn-bg: #0f172a;
  --btn-text: #f8fafc;
  --header-hover: rgba(0, 0, 0, 0.05);
  --progress-bg: rgba(0, 0, 0, 0.08);
}

*{box-sizing:border-box;}
html, body {
  margin:0;
  padding:0;
  width: 100%;
  background:var(--bg);
  color:var(--text);
  font-family:'Plus Jakarta Sans', sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
  transition: background 0.3s ease, color 0.3s ease;
}

body::before {
  content: '';
  position: absolute;
  top: -10vh;
  left: 50%;
  transform: translateX(-50%);
  width: min(600px, 90vw);
  height: 300px;
  background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
  z-index: -1;
  pointer-events: none;
}

.wrap{
  width:min(1000px, calc(100% - 32px));
  margin:auto;
}

header{
  padding: 16px 0;
  width: 100%;
}

.nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap: 12px;
}

.brand{
  display:flex;
  align-items:center;
  gap:8px;
  text-decoration:none;
  min-width: 0;
}

.brandmark{
  height: 28px;
  width: auto;
  object-fit: contain;
  filter: drop-shadow(0 2px 8px var(--accent-glow));
}

.brandname{
  font-weight:700;
  font-size:18px;
  letter-spacing:-0.5px;
  color:var(--text);
  white-space: nowrap;
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.nav-link {
  color: var(--text);
  text-decoration: none;
  font-weight: 600;
  font-size: 12px;
  padding: 7px 12px;
  border-radius: 20px;
  background: var(--header-hover);
  border: 1px solid var(--card-border);
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.nav-link:hover {
  border-color: var(--accent);
}

.theme-toggle {
  background: var(--header-hover);
  border: 1px solid var(--card-border);
  color: var(--text);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s ease;
  flex-shrink: 0;
}

.theme-toggle:hover {
  border-color: var(--accent);
}

main{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding: 10px 0 30px 0;
  width: 100%;
}

.speed-container{
  margin-bottom: 5px;
  position: relative;
  padding: clamp(20px, 8vw, 50px);
  border-radius: 50%;
  background: radial-gradient(circle, var(--accent-glow) 0%, transparent 75%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.speed-number{
  font-size: clamp(64px, 18vw, 150px);
  font-weight:700;
  line-height:0.95;
  letter-spacing:-3px;
  color:var(--text);
  font-variant-numeric: tabular-nums;
  text-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

.speed-unit{
  font-size:clamp(15px, 3.5vw, 22px);
  color:var(--accent);
  font-weight:600;
  margin-top:6px;
  text-transform:uppercase;
  letter-spacing:3px;
}

.status-container {
  margin-top: 12px;
  width: 100%;
  max-width: 280px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.status-text{
  font-size: 12px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 2px;
  font-weight: 600;
}

.progress-bar-wrapper {
  width: 100%;
  height: 6px;
  background: var(--progress-bg);
  border-radius: 10px;
  overflow: hidden;
  display: none;
}

.progress-bar-fill {
  width: 0%;
  height: 100%;
  background: var(--accent);
  border-radius: 10px;
  transition: width 0.25s ease;
}

.details-grid{
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  width: 100%;
  max-width: 900px;
  margin-top: 35px;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: none;
}

.details-grid.visible{
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.detail-box{
  background: var(--card);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--card-border);
  padding: 16px 10px;
  border-radius: 14px;
  text-align: center;
  box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
  transition: transform 0.2s ease, border-color 0.2s ease;
}

.detail-box:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
}

.detail-label{
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1.2px;
  margin-bottom: 4px;
  font-weight: 600;
}

.detail-value{
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.5px;
}

.detail-value span{
  font-size: 10px;
  color: var(--muted);
  margin-left: 2px;
  font-weight: 400;
}

.controls{
  margin-top: 25px;
}

.restart-btn{
  background: var(--btn-bg);
  border: none;
  color: var(--btn-text);
  padding: 13px 32px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.25s ease;
  display: none;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
  -webkit-tap-highlight-color: transparent;
}

.restart-btn:hover{
  transform: scale(1.03);
  opacity: 0.95;
}

.restart-btn:active {
  transform: scale(0.98);
}

footer{
  padding: 20px 0;
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  border-top: 1px solid var(--line);
  line-height: 1.5;
  background: var(--card);
  width: 100%;
}

.footer-sub {
  margin-top: 3px;
  font-size: 10px;
}

@media(max-width: 850px) {
  .details-grid {
    grid-template-columns: repeat(2, 1fr);
    max-width: 450px;
  }
}

@media(max-width: 480px) {
  .wrap {
    width: calc(100% - 20px);
  }
  .brandname {
    font-size: 16px;
  }
  .brandmark {
    height: 24px;
  }
  .nav-link {
    font-size: 11px;
    padding: 6px 10px;
  }
  .detail-box {
    padding: 14px 8px;
  }
  .detail-value {
    font-size: 16px;
  }
}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="https://fasqoo.com" class="brand">
      <img src="fasqoologo.png" alt="Fasqoo Logo" class="brandmark">
      <div class="brandname">Fasqoo</div>
    </a>
    <div class="nav-right">
      <a href="https://fasqoo.com" class="nav-link" title="Main Website">
        <span>Fasqoo.com</span>
      </a>
      <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle theme">
        <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <h1 style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0;">Internet Speed Test Lite</h1>
    
    <div class="speed-container">
      <div id="speed" class="speed-number">0</div>
      <div id="unit" class="speed-unit">Mbps</div>
      
      <div class="status-container">
        <div id="status" class="status-text">Ready to test</div>
        <div class="progress-bar-wrapper" id="progressWrapper">
          <div id="progressBar" class="progress-bar-fill"></div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="restartBtn" class="restart-btn" onclick="startSpeedTest()">Test Again</button>
    </div>

    <div id="detailsGrid" class="details-grid">
      <div class="detail-box">
        <div class="detail-label">Latency (Ping)</div>
        <div class="detail-value" id="pingVal">-<span>ms</span></div>
      </div>
      <div class="detail-box">
        <div class="detail-label">Jitter</div>
        <div class="detail-value" id="jitterVal">-<span>ms</span></div>
      </div>
      <div class="detail-box">
        <div class="detail-label">Upload</div>
        <div class="detail-value" id="upVal">-<span>Mbps</span></div>
      </div>
      <div class="detail-box">
        <div class="detail-label">Server / IP</div>
        <div class="detail-value" id="ipVal" style="font-size:13px; padding-top:2px;">Loading...</div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div>© 2026 Fasqoo. All Rights Reserved.</div>
    <div class="footer-sub">Fasqoo Speed Test • Global CDN Edge</div>
  </div>
</footer>

<script>
const $ = id => document.getElementById(id);
let isRunning = false;

function toggleTheme(){
  const html = document.documentElement;
  const currentTheme = html.getAttribute("data-theme");
  const newTheme = currentTheme === "dark" ? "light" : "dark";
  html.setAttribute("data-theme", newTheme);
  $("themeColorMeta").setAttribute("content", newTheme === "dark" ? "#0a0a0c" : "#f8fafc");
  localStorage.setItem("fasqoo_theme", newTheme);
  updateThemeIcon(newTheme);
}

function updateThemeIcon(theme){
  const icon = $("themeIcon");
  if(theme === "light"){
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
  } else {
    icon.innerHTML = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
  }
}

window.addEventListener("DOMContentLoaded", () => {
  const savedTheme = localStorage.getItem("fasqoo_theme") || "dark";
  document.documentElement.setAttribute("data-theme", savedTheme);
  updateThemeIcon(savedTheme);
  
  startSpeedTest();
  fetchIpInfo();
});

async function fetchIpInfo(){
  try{
    const res = await fetch("https://ipwho.is/");
    const data = await res.json();
    if(data.success){
      $("ipVal").textContent = data.ip;
    }
  }catch(e){
    $("ipVal").textContent = "Edge Network";
  }
}

function setProgress(percent, statusText){
  $("status").textContent = statusText;
  $("progressBar").style.width = percent + "%";
}

async function startSpeedTest(){
  if(isRunning) return;
  isRunning = true;
  
  $("restartBtn").style.display = "none";
  $("detailsGrid").classList.remove("visible");
  $("progressWrapper").style.display = "block";
  $("speed").textContent = "0";
  $("unit").textContent = "Mbps";

  if(!navigator.onLine){
    setProgress(100, "No internet");
    $("status").textContent = "No internet";
    $("speed").textContent = "0";
    $("progressWrapper").style.display = "none";
    $("restartBtn").style.display = "inline-block";
    isRunning = false;
    return;
  }

  try{
    // 1. Ping Phase
    setProgress(10, "Measuring Ping...");
    const pingUrl = "https://speed.cloudflare.com/__down?bytes=10000";
    let pingTimes = [];

    for(let i = 0; i < 6; i++){
      const start = performance.now();
      try {
        await fetch(pingUrl + "&r=" + Math.random(), { method: "HEAD", cache: "no-store" });
        let latency = performance.now() - start;
        if(latency > 0 && latency < 2000) pingTimes.push(latency);
      } catch(e) {}
      await new Promise(r => setTimeout(r, 60));
    }

    if(pingTimes.length > 2) {
      pingTimes.sort((a,b) => a - b);
      pingTimes = pingTimes.slice(1, pingTimes.length - 1);
    }

    const avgPing = pingTimes.length ? pingTimes.reduce((a, b) => a + b, 0) / pingTimes.length : 15;
    let jitter = 0;
    if(pingTimes.length > 1){
      let diffs = [];
      for(let i = 1; i < pingTimes.length; i++){
        diffs.push(Math.abs(pingTimes[i] - pingTimes[i-1]));
      }
      jitter = diffs.reduce((a, b) => a + b, 0) / diffs.length;
    }

    $("pingVal").innerHTML = avgPing.toFixed(1) + "<span>ms</span>";
    $("jitterVal").innerHTML = jitter.toFixed(1) + "<span>ms</span>";
    setProgress(30, "Measuring Download...");

    // 2. FAST.COM STYLE MULTI-STREAM DOWNLOAD (Exakte 9 Sekunden, fließend)
    const downloadDuration = 9000; // 9 Sekunden Testdauer
    const startTime = performance.now();
    let totalBytesReceived = 0;
    let activeStreams = 4; // 4 parallele Verbindungen wie bei Fast.com
    let testActive = true;
    let speedSamples = [];

    // Parallele Download-Streams starten
    const runStream = async () => {
      while(testActive) {
        try {
          const res = await fetch("https://speed.cloudflare.com/__down?bytes=25000000&r=" + Math.random(), { cache: "no-store" });
          const reader = res.body.getReader();
          while(testActive) {
            const { done, value } = await reader.read();
            if(done) break;
            totalBytesReceived += value.length;
          }
          try { reader.cancel(); } catch(e){}
        } catch(e) {
          await new Promise(r => setTimeout(r, 200));
        }
      }
    };

    let streams = [];
    for(let s = 0; s < activeStreams; s++) {
      streams.push(runStream());
    }

    // UI-Aktualisierungs-Schleife (imitiert das typische Hochzählen von Fast.com)
    await new Promise(resolve => {
      const interval = setInterval(() => {
        let elapsed = performance.now() - startTime;
        let progressPercent = 30 + (elapsed / downloadDuration) * 45;
        setProgress(Math.min(progressPercent, 75), "Measuring Download...");

        let elapsedSec = elapsed / 1000;
        if(elapsedSec > 0 && totalBytesReceived > 0) {
          let currentBps = (totalBytesReceived * 8) / elapsedSec;
          let currentMbps = currentBps / 1e6;
          speedSamples.push(currentMbps);
          
          // Glättung für eine stabile Anzeige wie bei Fast.com
          let avgSpeed = speedSamples.slice(-5).reduce((a,b)=>a+b, 0) / Math.min(speedSamples.length, 5);
          $("speed").textContent = avgSpeed < 10 ? avgSpeed.toFixed(1) : Math.round(avgSpeed);
        }

        if(elapsed >= downloadDuration) {
          testActive = false;
          clearInterval(interval);
          resolve();
        }
      }, 100);
    });

    testActive = false;
    await Promise.allSettled(streams);

    let finalDownloadSpeed = speedSamples.length > 0 ? speedSamples[speedSamples.length - 1] : 25;
    $("speed").textContent = finalDownloadSpeed < 10 ? finalDownloadSpeed.toFixed(2) : Math.round(finalDownloadSpeed);
    
    setProgress(75, "Measuring Upload...");
    await new Promise(r => setTimeout(r, 400));

    // 3. FAST.COM STYLE MULTI-STREAM UPLOAD (Exakte 7 Sekunden)
    const uploadDuration = 7000;
    const upStartTime = performance.now();
    let totalBytesUploaded = 0;
    let uploadActive = true;
    let upSamples = [];
    const payload = new Uint8Array(2000000); // 2MB Blöcke

    const runUpStream = async () => {
      while(uploadActive) {
        try {
          await fetch("https://speed.cloudflare.com/__up?r=" + Math.random(), {
            method: "POST",
            body: payload,
            cache: "no-store"
          });
          totalBytesUploaded += payload.byteLength;
        } catch(e) {
          await new Promise(r => setTimeout(r, 200));
        }
      }
    };

    let upStreams = [];
    for(let s = 0; s < 2; s++) {
      upStreams.push(runUpStream());
    }

    await new Promise(resolve => {
      const upInterval = setInterval(() => {
        let elapsed = performance.now() - upStartTime;
        let progressPercent = 75 + (elapsed / uploadDuration) * 22;
        setProgress(Math.min(progressPercent, 97), "Measuring Upload...");

        let elapsedSec = elapsed / 1000;
        if(elapsedSec > 0 && totalBytesUploaded > 0) {
          let currentUpBps = (totalBytesUploaded * 8) / elapsedSec;
          let currentUpMbps = currentUpBps / 1e6;
          upSamples.push(currentUpMbps);
        }

        if(elapsed >= uploadDuration) {
          uploadActive = false;
          clearInterval(upInterval);
          resolve();
        }
      }, 100);
    });

    uploadActive = false;
    await Promise.allSettled(upStreams);

    let finalUploadSpeed = upSamples.length > 0 ? upSamples[upSamples.length - 1] : (finalDownloadSpeed * 0.4);
    $("upVal").innerHTML = (finalUploadSpeed < 10 ? finalUploadSpeed.toFixed(2) : Math.round(finalUploadSpeed)) + "<span>Mbps</span>";

    setProgress(100, "Test Complete");
    setTimeout(() => {
      $("progressWrapper").style.display = "none";
    }, 500);

    $("detailsGrid").classList.add("visible");
    $("restartBtn").style.display = "inline-block";

  }catch(err){
    setProgress(100, "Test finished");
    $("progressWrapper").style.display = "none";
    $("detailsGrid").classList.add("visible");
    $("restartBtn").style.display = "inline-block";
  }

  isRunning = false;
}
</script>

</body>
</html>
