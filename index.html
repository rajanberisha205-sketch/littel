:root{
  --bg:#09090b;
  --card:rgba(24,24,27,.78);
  --border:rgba(255,255,255,.08);
  --text:#f4f4f5;
  --muted:#a1a1aa;
  --line:#27272a;
  --accent:#ef4444;
  --accent-soft:rgba(239,68,68,.12);
}

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
}

html{
  overflow:hidden;
}

body{
  min-height:100dvh;
  height:100dvh;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:"Plus Jakarta Sans",sans-serif;
  display:flex;
  flex-direction:column;
}

body::before{
  content:"";
  position:fixed;
  width:min(700px,100vw);
  height:350px;
  left:50%;
  top:-140px;
  transform:translateX(-50%);
  background:radial-gradient(
    circle,
    rgba(239,68,68,.09),
    transparent 70%
  );
  pointer-events:none;
}

.wrap{
  width:min(920px,calc(100% - 32px));
  margin:auto;
}

/* HEADER */

header{
  flex:0 0 auto;
  padding:clamp(10px,2vh,22px) 0;
  position:relative;
  z-index:10;
}

.nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--text);
  text-decoration:none;
}

.brandmark{
  width:auto;
  height:clamp(27px,4vh,35px);
  object-fit:contain;
}

.brandname{
  font-size:clamp(19px,2.5vw,23px);
  font-weight:700;
  letter-spacing:-.6px;
}

/* MAIN */

main{
  flex:1 1 auto;
  min-height:0;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  z-index:1;
}

.main-inner{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.visually-hidden{
  position:absolute!important;
  width:1px!important;
  height:1px!important;
  padding:0!important;
  margin:-1px!important;
  overflow:hidden!important;
  clip:rect(0,0,0,0)!important;
  white-space:nowrap!important;
  border:0!important;
}

/* =========================================================
   SPEEDOMETER
   ========================================================= */

.speedometer{
  width:min(72vw,470px);
  height:auto;
  aspect-ratio:1;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

/*
  The SVG is deliberately square and circular.
  This prevents the gauge from becoming distorted
  on different screen sizes.
*/

.gauge{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:visible;
}

.gauge-track{
  fill:none;
  stroke:#252529;
  stroke-width:7;
}

.gauge-progress{
  fill:none;
  stroke:var(--accent);
  stroke-width:7;
  stroke-linecap:round;

  /*
    1000 is intentionally larger than the actual path
    so CSS can use stroke-dasharray proportionally.
  */
  stroke-dasharray:1000;
  stroke-dashoffset:1000;

  filter:
    drop-shadow(
      0 0 8px
      rgba(239,68,68,.28)
    );
}

.gauge-inner{
  fill:none;
  stroke:rgba(255,255,255,.035);
  stroke-width:1;
}

.tick{
  stroke:#5a5a61;
  stroke-width:1.5;
  stroke-linecap:round;
}

.tick.major{
  stroke:#85858c;
  stroke-width:2;
}

.tick-label{
  fill:#77777f;
  font-size:11px;
  font-weight:500;
  text-anchor:middle;
  dominant-baseline:middle;
}

.needle{
  transform-origin:250px 250px;
  transform:rotate(-135deg);
  transition:transform .45s cubic-bezier(.22,.61,.36,1);
}

.needle-line{
  stroke:var(--text);
  stroke-width:3;
  stroke-linecap:round;
}

.needle-tip{
  fill:var(--text);
}

.needle-center{
  fill:var(--accent);
  stroke:#09090b;
  stroke-width:5;
}

/* Center */

.speed-center{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  pointer-events:none;
}

.speed-number{
  font-size:clamp(55px,11vw,112px);
  font-weight:700;
  line-height:.9;
  letter-spacing:-4px;
  font-variant-numeric:tabular-nums;
  text-shadow:0 8px 25px rgba(0,0,0,.55);
}

.speed-unit{
  margin-top:10px;
  color:var(--accent);
  font-size:clamp(13px,2vw,20px);
  font-weight:600;
  letter-spacing:3px;
  text-transform:uppercase;
}

.status{
  margin-top:9px;
  min-height:18px;
  padding:0 10px;
  color:var(--muted);
  font-size:clamp(9px,1.4vw,12px);
  letter-spacing:1.3px;
  text-transform:uppercase;
  text-align:center;
}

/* progress */

.progress{
  position:absolute;
  width:min(380px,65vw);
  height:3px;
  left:50%;
  bottom:-12px;
  transform:translateX(-50%);
  background:#222225;
  border-radius:10px;
  overflow:hidden;
}

.progress-bar{
  width:0;
  height:100%;
  background:var(--accent);
  transition:width .2s linear;
}

/* DETAILS */

.details-grid{
  width:100%;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:clamp(8px,1.5vh,18px);
  opacity:0;
  transform:translateY(8px);
  transition:
    opacity .35s ease,
    transform .35s ease;
  pointer-events:none;
}

.details-grid.visible{
  opacity:1;
  transform:translateY(0);
  pointer-events:auto;
}

.detail-box{
  min-width:0;
  padding:clamp(9px,1.5vh,15px) 8px;
  border-radius:11px;
  border:1px solid var(--border);
  background:var(--card);
  backdrop-filter:blur(12px);
  text-align:center;
}

.detail-label{
  color:var(--muted);
  font-size:clamp(8px,1.1vw,10px);
  font-weight:600;
  letter-spacing:1px;
  text-transform:uppercase;
  margin-bottom:5px;
}

.detail-value{
  color:var(--text);
  font-size:clamp(15px,2.2vw,21px);
  font-weight:600;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.detail-value span{
  margin-left:2px;
  color:var(--muted);
  font-size:10px;
  font-weight:400;
}

/* BUTTON */

.controls{
  min-height:38px;
  margin-top:clamp(7px,1.2vh,13px);
}

.restart{
  display:none;
  border:0;
  border-radius:50px;
  padding:10px 26px;
  background:var(--text);
  color:var(--bg);
  font-family:inherit;
  font-size:10px;
  font-weight:600;
  letter-spacing:1.4px;
  text-transform:uppercase;
  cursor:pointer;
  transition:transform .2s ease;
}

.restart:hover{
  transform:scale(1.03);
}

.restart:active{
  transform:scale(.97);
}

/* FOOTER */

footer{
  flex:0 0 auto;
  padding:clamp(6px,1.3vh,13px) 0;
  border-top:1px solid rgba(39,39,42,.75);
  background:rgba(9,9,11,.55);
  color:var(--muted);
  text-align:center;
  font-size:9px;
  line-height:1.5;

<script>
"use strict";

/* =========================================================
   ELEMENTS
   ========================================================= */

const $ = id => document.getElementById(id);

const SPEED_BASE =
  "https://speed.cloudflare.com";


/* =========================================================
   TEST CONFIGURATION
   =========================================================

   This is intentionally a time-based test.

   Download:
   minimum 8 seconds
   maximum 15 seconds

   Upload:
   minimum 7 seconds
   maximum 12 seconds

   Multiple parallel streams are used so a fast connection
   has enough traffic to reach a representative throughput.

   These are real HTTP measurements.

   No fake speed values are generated.
   ========================================================= */

const CONFIG = {

  latencySamples:8,

  downloadStreams:6,
  downloadChunk:5 * 1024 * 1024,
  downloadMin:8000,
  downloadMax:15000,

  uploadStreams:4,
  uploadChunk:2 * 1024 * 1024,
  uploadMin:7000,
  uploadMax:12000,

  requestTimeout:20000

};


let isRunning = false;


/* =========================================================
   GAUGE
   ========================================================= */

const MAX_DISPLAY_SPEED = 1000;


/*
  Gauge starts at -135 degrees and ends at +135 degrees.

  The needle is deliberately limited to the gauge range.
*/

function speedToAngle(speed){

  if(!Number.isFinite(speed) || speed <= 0){

    return -135;

  }

  const normalized =
    Math.min(
      speed / MAX_DISPLAY_SPEED,
      1
    );

  return -135 + normalized * 270;

}


function setNeedle(speed){

  const angle =
    speedToAngle(speed);

  $("needle").style.transform =
    `rotate(${angle}deg)`;

}


/*
  The gauge progress uses 750 units of the 1000-unit
  circle path.
*/

function setGauge(speed){

  const normalized =
    Math.max(
      0,
      Math.min(
        speed / MAX_DISPLAY_SPEED,
        1
      )
    );

  const length =
    normalized * 750;

  const offset =
    750 - length;

  $("gaugeProgress")
    .style.strokeDashoffset =
    offset;

}


/*
  Generate proper circular gauge ticks.
*/

function createTicks(){

  const group =
    $("ticks");

  const center = 250;

  const radiusOuter = 204;

  const radiusInnerMajor = 190;

  const radiusInnerMinor = 195;

  const labelRadius = 166;

  /*
    0 to 1000 Mbps
    21 positions
  */

  for(let i=0;i<=20;i++){

    const ratio =
      i / 20;

    const angle =
      (-135 + ratio * 270)
      * Math.PI / 180;

    const major =
      i % 2 === 0;

    const inner =
      major
        ? radiusInnerMajor
        : radiusInnerMinor;

    const x1 =
      center +
      Math.cos(angle) *
      radiusOuter;

    const y1 =
      center +
      Math.sin(angle) *
      radiusOuter;

    const x2 =
      center +
      Math.cos(angle) *
      inner;

    const y2 =
      center +
      Math.sin(angle) *
      inner;

    const line =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "line"
      );

    line.setAttribute("x1",x1);
    line.setAttribute("y1",y1);
    line.setAttribute("x2",x2);
    line.setAttribute("y2",y2);

    line.setAttribute(
      "class",
      major ? "tick major" : "tick"
    );

    group.appendChild(line);


    /*
      Labels every 200 Mbps.
    */

    if(major){

      const value =
        i * 50;

      const lx =
        center +
        Math.cos(angle) *
        labelRadius;

      const ly =
        center +
        Math.sin(angle) *
        labelRadius;

      const text =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "text"
        );

      text.setAttribute("x",lx);
      text.setAttribute("y",ly);

      text.setAttribute(
        "class",
        "tick-label"
      );

      text.textContent =
        value;

      group.appendChild(text);

    }

  }

}


/* =========================================================
   DISPLAY
   ========================================================= */

function formatSpeed(speed){

  if(
    !Number.isFinite(speed) ||
    speed < 0
  ){

    return "0";

  }

  if(speed < 10){

    return speed.toFixed(1);

  }

  if(speed < 100){

    return speed.toFixed(1);

  }

  return Math.round(speed).toString();

}


function displaySpeed(speed){

  const value =
    Math.max(
      0,
      Number.isFinite(speed)
        ? speed
        : 0
    );

  $("speed").textContent =
    formatSpeed(value);

  setNeedle(value);

  setGauge(value);

}


function setStatus(text){

  $("status").textContent =
    text;

}


function setProgress(percent){

  const value =
    Math.max(
      0,
      Math.min(100,percent)
    );

  $("progressBar")
    .style.width =
    value + "%";

}


/* =========================================================
   IP
   ========================================================= */

async function fetchIpInfo(){

  try{

    const controller =
      new AbortController();

    const timeout =
      setTimeout(
        () => controller.abort(),
        5000
      );

    const response =
      await fetch(
        "https://ipwho.is/",
        {
          cache:"no-store",
          signal:controller.signal
        }
      );

    clearTimeout(timeout);

    const data =
      await response.json();

    if(
      data &&
      data.success &&
      data.ip
    ){

      $("ipVal").textContent =
        data.ip;

    }else{

      $("ipVal").textContent =
        "Unavailable";

    }

  }catch(error){

    $("ipVal").textContent =
      "Unavailable";

  }

}


/* =========================================================
   LATENCY
   =========================================================

   Browser limitation:

   This is HTTP latency to Cloudflare Edge.

   It is not ICMP ping because normal browser JavaScript
   cannot directly send ICMP packets.
   ========================================================= */

async function measureLatency(){

  setStatus(
    "Measuring latency..."
  );

  const values = [];

  for(
    let i=0;
    i<CONFIG.latencySamples;
    i++
  ){

    if(!isRunning){

      break;

    }

    const controller =
      new AbortController();

    const timer =
      setTimeout(
        () => controller.abort(),
        5000
      );

    const start =
      performance.now();

    try{

      const response =
        await fetch(
          SPEED_BASE +
          "/__down?bytes=0&r=" +
          crypto.randomUUID(),
          {
            cache:"no-store",
            signal:controller.signal
          }
        );

      if(response.ok){

        const elapsed =
          performance.now() -
          start;

        values.push(elapsed);

      }

    }catch(error){

      /*
        Failed requests are ignored.
        No artificial latency is inserted.
      */

    }finally{

      clearTimeout(timer);

    }

    setProgress(
      (i + 1) /
      CONFIG.latencySamples *
      5
    );

  }


  if(values.length === 0){

    return {
      ping:null,
      jitter:null
    };

  }


  /*
    Sort and remove the highest result when
    enough samples are available.
  */

  const sorted =
    [...values].sort(
      (a,b) => a-b
    );

  const usable =
    sorted.length >= 5
      ? sorted.slice(0,-1)
      : sorted;


  const ping =
    usable.reduce(
      (a,b) => a+b,
      0
    ) / usable.length;


  let jitter = 0;

  if(usable.length > 1){

    for(
      let i=1;
      i<usable.length;
      i++
    ){

      jitter +=
        Math.abs(
          usable[i] -
          usable[i-1]
        );

    }

    jitter /=
      usable.length - 1;

  }


  return {
    ping,
    jitter
  };

}


/* =========================================================
   DOWNLOAD
   ========================================================= */

async function measureDownload(){

  setStatus(
    "Measuring download..."
  );

  const start =
    performance.now();

  let totalBytes = 0;

  let stop = false;

  const workers = [];


  async function worker(){

    while(
      isRunning &&
      !stop
    ){

      const controller =
        new AbortController();

      const timer =
        setTimeout(
          () => controller.abort(),
          CONFIG.requestTimeout
        );

      try{

        const response =
          await fetch(
            SPEED_BASE +
            "/__down?bytes=" +
            CONFIG.downloadChunk +
            "&r=" +
            crypto.randomUUID(),
            {
              cache:"no-store",
              signal:controller.signal
            }
          );

        if(!response.ok){

          continue;

        }

        const buffer =
          await response.arrayBuffer();

        /*
          Only bytes actually received are counted.
        */

        if(buffer.byteLength > 0){

          totalBytes +=
            buffer.byteLength;

        }

      }catch(error){

        if(!isRunning){

          break;

        }

      }finally{

        clearTimeout(timer);

      }

    }

  }


  /*
    Start parallel streams.
  */

  for(
    let i=0;
    i<CONFIG.downloadStreams;
    i++
  ){

    workers.push(
      worker()
    );

  }


  let lastDisplayed = 0;


  while(
    isRunning &&
    !stop
  ){

    await new Promise(
      resolve =>
        setTimeout(resolve,200)
    );


    const elapsedMs =
      performance.now() -
      start;

    const elapsed =
      elapsedMs / 1000;


    const speed =
      elapsed > 0
        ? totalBytes *
          8 /
          elapsed /
          1000000
        : 0;


    /*
      Smooth only the visual display.

      The actual final value remains calculated
      from total bytes / total measurement time.
    */

    if(speed > 0){

      const smoothing =
        lastDisplayed === 0
          ? .35
          : .20;

      lastDisplayed =
        lastDisplayed +
        (speed - lastDisplayed) *
        smoothing;

      displaySpeed(
        lastDisplayed
      );

    }


    /*
      Download occupies 5%–65% of progress.
    */

    const percentage =
      Math.min(
        elapsedMs /
        CONFIG.downloadMax *
        100,
        100
      );

    setProgress(
      5 + percentage * .60
    );


    /*
      Never stop before minimum duration.
    */

    if(
      elapsedMs >=
      CONFIG.downloadMin
    ){

      /*
        After the minimum duration, allow the test
        to finish once the maximum duration is reached.

        This keeps the test predictable and long enough
        for a proper throughput measurement.
      */

      if(
        elapsedMs >=
        CONFIG.downloadMax
      ){

        stop = true;

      }

    }

  }


  await Promise.allSettled(
    workers
  );


  const elapsed =
    (performance.now() -
      start) / 1000;


  /*
    REAL FINAL SPEED
  */

  const finalSpeed =
    elapsed > 0
      ? totalBytes *
        8 /
        elapsed /
        1000000
      : 0;


  displaySpeed(
    finalSpeed
  );


  return finalSpeed;

}


/* =========================================================
   UPLOAD
   ========================================================= */

async function measureUpload(){

  setStatus(
    "Measuring upload..."
  );

  const start =
    performance.now();

  let totalBytes = 0;

  let stop = false;

  const workers = [];


  /*
    Create upload payload.
  */

  const payload =
    new Uint8Array(
      CONFIG.uploadChunk
    );


  /*
    Fill it with random data.
  */

  if(
    window.crypto &&
    window.crypto.getRandomValues
  ){

    const block =
      new Uint8Array(
        1024 * 1024
      );

    crypto.getRandomValues(
      block
    );

    for(
      let offset=0;
      offset<payload.length;
      offset+=block.length
    ){

      payload.set(
        block.subarray(
          0,
          Math.min(
            block.length,
            payload.length -
            offset
          )
        ),
        offset
      );

    }

  }


  async function worker(){

    while(
      isRunning &&
      !stop
    ){

      const controller =
        new AbortController();

      const timer =
        setTimeout(
          () => controller.abort(),
          CONFIG.requestTimeout
        );

      try{

        const response =
          await fetch(
            SPEED_BASE +
            "/__up?r=" +
            crypto.randomUUID(),
            {
              method:"POST",
              body:payload,
              cache:"no-store",
              signal:controller.signal
            }
          );

        if(response.ok){

          /*
            Count the upload only after the request
            successfully completes.
          */

          totalBytes +=
            payload.byteLength;

        }

      }catch(error){

        if(!isRunning){

          break;

        }

      }finally{

        clearTimeout(timer);

      }

    }

  }


  for(
    let i=0;
    i<CONFIG.uploadStreams;
    i++
  ){

    workers.push(
      worker()
    );

  }


  let lastDisplayed = 0;


  while(
    isRunning &&
    !stop
  ){

    await new Promise(
      resolve =>
        setTimeout(resolve,200)
    );


    const elapsedMs =
      performance.now() -
      start;

    const elapsed =
      elapsedMs / 1000;


    const speed =
      elapsed > 0
        ? totalBytes *
          8 /
          elapsed /
          1000000
        : 0;


    if(speed > 0){

      const smoothing =
        lastDisplayed === 0
          ? .35
          : .20;

      lastDisplayed =
        lastDisplayed +
        (speed - lastDisplayed) *
        smoothing;

      $("upVal").innerHTML =
        formatSpeed(
          lastDisplayed
        ) +
        "<span>Mbps</span>";

    }


    /*
      Upload occupies the final 35%.
    */

    const percentage =
      Math.min(
        elapsedMs /
        CONFIG.uploadMax *
        100,
        100
      );

    setProgress(
      65 + percentage * .35
    );


    if(
      elapsedMs >=
      CONFIG.uploadMax
    ){

      stop = true;

    }

  }


  await Promise.allSettled(
    workers
  );


  const elapsed =
    (performance.now() -
      start) / 1000;


  /*
    REAL FINAL UPLOAD
  */

  const finalSpeed =
    elapsed > 0
      ? totalBytes *
        8 /
        elapsed /
        1000000
      : 0;


  $("upVal").innerHTML =
    formatSpeed(finalSpeed) +
    "<span>Mbps</span>";


  return finalSpeed;

}


/* =========================================================
   MAIN TEST
   ========================================================= */

async function startSpeedTest(){

  if(isRunning){

    return;

  }

  isRunning = true;

  $("restartBtn").style.display =
    "none";

  $("detailsGrid")
    .classList
    .remove("visible");

  $("speed").textContent =
    "0";

  $("pingVal").innerHTML =
    "-<span>ms</span>";

  $("jitterVal").innerHTML =
    "-<span>ms</span>";

  $("upVal").innerHTML =
    "-<span>Mbps</span>";

  setProgress(0);

  setNeedle(0);

  setGauge(0);


  try{

    /*
      STEP 1
    */

    const latency =
      await measureLatency();


    if(latency.ping !== null){

      $("pingVal").innerHTML =
        latency.ping.toFixed(0) +
        "<span>ms</span>";

    }else{

      $("pingVal").innerHTML =
        "N/A";

    }


    if(latency.jitter !== null){

      $("jitterVal").innerHTML =
        latency.jitter.toFixed(1) +
        "<span>ms</span>";

    }else{

      $("jitterVal").innerHTML =
        "N/A";

    }


    /*
      STEP 2
    */

    const download =
      await measureDownload();


    if(
      !Number.isFinite(download) ||
      download <= 0
    ){

      throw new Error(
        "No valid download measurement"
      );

    }


    /*
      STEP 3
    */

    const upload =
      await measureUpload();


    /*
      Final state
    */

    setProgress(100);

    displaySpeed(
      download
    );


    if(
      Number.isFinite(upload) &&
      upload > 0
    ){

      $("upVal").innerHTML =
        formatSpeed(upload) +
        "<span>Mbps</span>";

    }


    setStatus(
      "Test complete"
    );


    $("detailsGrid")
      .classList
      .add("visible");


    $("restartBtn").style.display =
      "inline-block";


  }catch(error){

    console.error(
      "Fasqoo Lite test error:",
      error
    );

    setStatus(
      "Test could not be completed"
    );

    $("restartBtn").style.display =
      "inline-block";

  }


  isRunning = false;

}


/* =========================================================
   INIT
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    createTicks();

    fetchIpInfo();

    $("restartBtn")
      .addEventListener(
        "click",
        startSpeedTest
      );

    startSpeedTest();

  }
);
