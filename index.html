<script>
"use strict";

const $ = id => document.getElementById(id);

const SPEED_BASE = "https://speed.cloudflare.com";

/*
  FAST.COM-STYLE TEST SETTINGS

  The old version tested:
  1 MB
  2 MB
  5 MB
  10 MB
  20 MB
  ...

  sequentially.

  That can finish too quickly and can under-use a fast connection.

  This version uses multiple parallel streams and a time-based
  measurement window instead.
*/

const CONFIG = {

  /* Unloaded latency */
  latencySamples: 8,

  /* Download */
  downloadMinDuration: 8000,
  downloadMaxDuration: 15000,
  downloadStreams: 6,

  /* Upload */
  uploadMinDuration: 7000,
  uploadMaxDuration: 12000,
  uploadStreams: 4,

  /* Start with 5 MB chunks */
  downloadChunk: 5 * 1024 * 1024,

  /* Upload chunk */
  uploadChunk: 2 * 1024 * 1024,

  /* Individual request safety timeout */
  requestTimeout: 20000
};

let isRunning = false;
let abortController = null;

window.addEventListener("DOMContentLoaded", () => {

  startSpeedTest();

  fetchIpInfo();

});


/* =========================================================
   IP
   ========================================================= */

async function fetchIpInfo(){

  try{

    const controller = new AbortController();

    const timeout = setTimeout(
      () => controller.abort(),
      5000
    );

    const response = await fetch(
      "https://ipwho.is/",
      {
        cache:"no-store",
        signal:controller.signal
      }
    );

    clearTimeout(timeout);

    const data = await response.json();

    if(data && data.success && data.ip){

      $("ipVal").textContent = data.ip;

    }else{

      $("ipVal").textContent = "Unavailable";

    }

  }catch(error){

    $("ipVal").textContent = "Unavailable";

  }

}


/* =========================================================
   HELPERS
   ========================================================= */

function sleep(ms){

  return new Promise(resolve => setTimeout(resolve,ms));

}


function updateProgress(percent){

  const safe = Math.max(
    0,
    Math.min(100,percent)
  );

  $("progressBar").style.width = safe + "%";

}


function setStatus(text){

  $("status").textContent = text;

}


function formatSpeed(speed){

  if(!Number.isFinite(speed) || speed < 0){

    return "0";

  }

  if(speed < 10){

    return speed.toFixed(1);

  }

  return Math.round(speed).toString();

}


function calculateJitter(values){

  if(values.length < 2){

    return 0;

  }

  let total = 0;

  for(let i=1;i<values.length;i++){

    total += Math.abs(
      values[i] - values[i-1]
    );

  }

  return total / (values.length - 1);

}


function createController(){

  return new AbortController();

}


/* =========================================================
   HTTP LATENCY
   =========================================================

   Important:
   This is NOT ICMP ping.

   Browsers cannot directly send normal ICMP packets.

   We therefore measure the real HTTP request/response
   latency to Cloudflare's edge.
*/

async function measureLatency(){

  const samples = [];

  setStatus("Measuring latency...");

  for(let i=0;i<CONFIG.latencySamples;i++){

    if(!isRunning) break;

    const start = performance.now();

    const controller = new AbortController();

    const timer = setTimeout(
      () => controller.abort(),
      5000
    );

    try{

      const response = await fetch(
        SPEED_BASE +
        "/__down?bytes=0&r=" +
        crypto.randomUUID(),
        {
          method:"GET",
          cache:"no-store",
          signal:controller.signal
        }
      );

      if(response.ok){

        const elapsed =
          performance.now() - start;

        samples.push(elapsed);

      }

    }catch(error){

      /* Do not create fake values */

    }finally{

      clearTimeout(timer);

    }

    updateProgress(
      (i + 1) /
      CONFIG.latencySamples *
      5
    );

  }

  if(samples.length === 0){

    return {
      ping:null,
      jitter:null
    };

  }

  /*
    Remove the slowest sample when enough samples
    exist, reducing the impact of browser scheduling.
  */

  const sorted = [...samples].sort(
    (a,b) => a-b
  );

  const usable =
    sorted.length >= 5
      ? sorted.slice(0,-1)
      : sorted;

  const ping =
    usable.reduce(
      (a,b) => a+b,
      0
    ) / usable.length;

  const jitter =
    calculateJitter(usable);

  return {
    ping,
    jitter
  };

}


/* =========================================================
   DOWNLOAD
   =========================================================

   Multiple simultaneous HTTP streams.

   The test continues for several seconds and stops
   after the measurement stabilizes or reaches the
   maximum duration.
*/

async function measureDownload(){

  setStatus("Measuring download...");

  const startTime = performance.now();

  let totalBytes = 0;

  let lastUpdate = startTime;

  let samples = [];

  let stopped = false;

  const workers = [];

  /*
    Each worker continuously requests fresh data.
  */

  async function worker(){

    while(
      isRunning &&
      !stopped
    ){

      const controller =
        new AbortController();

      const timeout = setTimeout(
        () => controller.abort(),
        CONFIG.requestTimeout
      );

      const start =
        performance.now();

      try{

        const response =
          await fetch(
            SPEED_BASE +
            "/__down?bytes=" +
            CONFIG.downloadChunk +
            "&r=" +
            crypto.randomUUID(),
            {
              method:"GET",
              cache:"no-store",
              signal:controller.signal
            }
          );

        if(!response.ok){

          continue;

        }

        const buffer =
          await response.arrayBuffer();

        const elapsed =
          (performance.now() - start) / 1000;

        if(
          buffer.byteLength > 0 &&
          elapsed > 0
        ){

          totalBytes +=
            buffer.byteLength;

        }

      }catch(error){

        if(!isRunning){

          break;

        }

      }finally{

        clearTimeout(timeout);

      }

    }

  }

  /*
    Start several streams at the same time.
  */

  for(
    let i=0;
    i<CONFIG.downloadStreams;
    i++
  ){

    workers.push(worker());

  }

  /*
    Measurement loop.
  */

  while(isRunning){

    await sleep(250);

    const elapsed =
      performance.now() - startTime;

    const seconds =
      elapsed / 1000;

    const speed =
      seconds > 0
        ? (totalBytes * 8) /
          seconds /
          1000000
        : 0;

    if(speed > 0){

      samples.push(speed);

      /*
        Display live speed.
      */

      $("speed").textContent =
        formatSpeed(speed);

    }

    /*
      Progress:
      8 sec = 53%
      15 sec = 100%
    */

    const progress =
      Math.min(
        100,
        elapsed /
        CONFIG.downloadMaxDuration *
        100
      );

    updateProgress(
      5 + progress * .60
    );

    /*
      Do not stop before the minimum duration.

      After that, stop when:
      - speed is reasonably stable
      - or maximum time is reached
    */

    if(
      elapsed >= CONFIG.downloadMinDuration
    ){

      let stable = false;

      if(samples.length >= 8){

        const recent =
          samples.slice(-8);

        const average =
          recent.reduce(
            (a,b) => a+b,
            0
          ) / recent.length;

        const min =
          Math.min(...recent);

        const max =
          Math.max(...recent);

        /*
          Stability window of approximately ±8%.
        */

        stable =
          average > 0 &&
          (max - min) /
          average < .16;

      }

      if(
        stable ||
        elapsed >=
        CONFIG.downloadMaxDuration
      ){

        stopped = true;

      }

    }

  }

  await Promise.allSettled(workers);

  const totalTime =
    (performance.now() - startTime) / 1000;

  const finalSpeed =
    totalTime > 0
      ? (totalBytes * 8) /
        totalTime /
        1000000
      : 0;

  return finalSpeed;

}


/* =========================================================
   UPLOAD
   ========================================================= */

async function measureUpload(){

  setStatus("Measuring upload...");

  const startTime =
    performance.now();

  let totalBytes = 0;

  let stopped = false;

  const workers = [];

  const payload =
    new Uint8Array(
      CONFIG.uploadChunk
    );

  /*
    Fill the buffer with pseudo-random data.

    This prevents the browser from reusing
    identical empty data.
  */

  if(window.crypto &&
     window.crypto.getRandomValues){

    const view =
      new Uint8Array(
        Math.min(
          payload.byteLength,
          1024 * 1024
        )
      );

    crypto.getRandomValues(view);

    for(
      let offset=0;
      offset<payload.byteLength;
      offset+=view.length
    ){

      payload.set(
        view.subarray(
          0,
          Math.min(
            view.length,
            payload.byteLength-offset
          )
        ),
        offset
      );

    }

  }


  async function worker(){

    while(
      isRunning &&
      !stopped
    ){

      const controller =
        new AbortController();

      const timeout =
        setTimeout(
          () => controller.abort(),
          CONFIG.requestTimeout
        );

      try{

        const response =
          await fetch(
            SPEED_BASE +
            "/__up?r=" +
            crypto.randomUUID(),
            {
              method:"POST",
              body:payload,
              cache:"no-store",
              signal:controller.signal
            }
          );

        if(response.ok){

          /*
            Count bytes only after a successful
            request has completed.
          */

          totalBytes +=
            payload.byteLength;

        }

      }catch(error){

        if(!isRunning){

          break;

        }

      }finally{

        clearTimeout(timeout);

      }

    }

  }


  for(
    let i=0;
    i<CONFIG.uploadStreams;
    i++
  ){

    workers.push(worker());

  }


  while(isRunning){

    await sleep(250);

    const elapsed =
      performance.now() - startTime;

    const seconds =
      elapsed / 1000;

    const speed =
      seconds > 0
        ? (totalBytes * 8) /
          seconds /
          1000000
        : 0;

    if(speed > 0){

      $("upVal").innerHTML =
        formatSpeed(speed) +
        "<span>Mbps</span>";

    }

    const progress =
      Math.min(
        100,
        elapsed /
        CONFIG.uploadMaxDuration *
        100
      );

    updateProgress(
      65 + progress * .35
    );

    if(
      elapsed >=
      CONFIG.uploadMinDuration
    ){

      /*
        Upload is deliberately allowed to run
        for several seconds rather than a tiny
        one-shot request.
      */

      if(
        elapsed >=
        CONFIG.uploadMaxDuration
      ){

        stopped = true;

      }

    }

  }


  await Promise.allSettled(workers);


  const totalTime =
    (performance.now() - startTime) / 1000;

  const finalSpeed =
    totalTime > 0
      ? (totalBytes * 8) /
        totalTime /
        1000000
      : 0;

  return finalSpeed;

}


/* =========================================================
   MAIN TEST
   ========================================================= */

async function startSpeedTest(){

  if(isRunning){

    return;

  }

  isRunning = true;

  abortController =
    createController();

  $("restartBtn").style.display =
    "none";

  $("detailsGrid")
    .classList
    .remove("visible");

  $("speed").textContent = "0";

  $("upVal").innerHTML =
    "-<span>Mbps</span>";

  $("pingVal").innerHTML =
    "-<span>ms</span>";

  $("jitterVal").innerHTML =
    "-<span>ms</span>";

  $("progress").classList.add("active");

  updateProgress(0);

  try{

    /*
      1. HTTP latency
    */

    const latency =
      await measureLatency();

    if(latency.ping !== null){

      $("pingVal").innerHTML =
        latency.ping.toFixed(0) +
        "<span>ms</span>";

    }else{

      $("pingVal").innerHTML =
        "N/A<span></span>";

    }

    if(latency.jitter !== null){

      $("jitterVal").innerHTML =
        latency.jitter.toFixed(1) +
        "<span>ms</span>";

    }else{

      $("jitterVal").innerHTML =
        "N/A<span></span>";

    }


    /*
      2. Download
    */

    const download =
      await measureDownload();

    if(download > 0){

      $("speed").textContent =
        formatSpeed(download);

    }else{

      throw new Error(
        "Download measurement failed"
      );

    }


    /*
      3. Upload
    */

    const upload =
      await measureUpload();

    if(upload > 0){

      $("upVal").innerHTML =
        formatSpeed(upload) +
        "<span>Mbps</span>";

    }else{

      $("upVal").innerHTML =
        "N/A<span></span>";

    }


    /*
      Complete
    */

    updateProgress(100);

    setStatus("Test complete");

    $("detailsGrid")
      .classList
      .add("visible");

    $("restartBtn").style.display =
      "inline-block";

  }catch(error){

    console.error(
      "Fasqoo Speed Test:",
      error
    );

    setStatus(
      "Test could not be completed"
    );

    $("restartBtn").style.display =
      "inline-block";

  }finally{

    isRunning = false;

    abortController = null;

    setTimeout(
      () => {
        $("progress")
          .classList
          .remove("active");
      },
      500
    );

  }

}
