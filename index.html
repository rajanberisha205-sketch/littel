<body>

<header>
  <div class="wrap nav">
    <a href="https://fasqoo.com" class="brand">
      <img src="fasqoologo.png" alt="Fasqoo Logo" class="brandmark">
      <div class="brandname">Fasqoo</div>
    </a>
    <div class="theme-controls" aria-label="Theme">
      <a class="fasqoo-link" href="https://www.fasqoo.com/" target="_blank" rel="noopener noreferrer" aria-label="Visit Fasqoo.com">Fasqoo.com</a>
      <button id="themeToggle" class="theme-btn" type="button"
              aria-label="Switch theme" title="Switch theme">☀</button>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <h1 style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0;">Internet Speed Test Lite</h1>
    
    <div class="speed-container">
      <div id="speed" class="speed-number">0</div>
      <div id="unit" class="speed-unit">Mbps</div>
      <div id="status" class="status-text">Initializing connection...</div>
    </div>

    <div class="controls">
      <button id="restartBtn" class="restart-btn" onclick="startSpeedTest()">Test Again</button>
    </div>

    <div id="detailsGrid" class="details-grid">
      <div class="detail-box">
        <div class="detail-label">Latency (Ping)</div>
        <div class="detail-value" id="pingVal">-<span>ms</span></div>
      </div>
      <div class="detail-box">
        <div class="detail-label">Jitter</div>
        <div class="detail-value" id="jitterVal">-<span>ms</span></div>
      </div>
      <div class="detail-box">
        <div class="detail-label">Upload</div>
        <div class="detail-value" id="upVal">-<span>Mbps</span></div>
      </div>
      <div class="detail-box">
        <div class="detail-label">Server / IP</div>
        <div class="detail-value" id="ipVal" style="font-size:15px; padding-top:4px;">Loading...</div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div>© 2026 Fasqoo. All Rights Reserved.</div>
    <div style="margin-top: 4px;">Fasqoo and Fasqoo Speed Test are trademarks of Fasqoo. • Powered by Cloudflare Edge</div>
  
  </div>

<script>

(function(){
  const saved = localStorage.getItem("fasqoo-theme");
  const prefersLight = window.matchMedia &&
    window.matchMedia("(prefers-color-scheme: light)").matches;
  const theme = saved === "light" || saved === "dark"
    ? saved
    : (prefersLight ? "light" : "dark");

  document.documentElement.dataset.theme = theme;

  window.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("themeToggle");
    if(!btn) return;

    function updateButton(){
      const isLight = document.documentElement.dataset.theme === "light";
      btn.textContent = isLight ? "☾" : "☀";
      btn.title = isLight ? "Switch to dark mode" : "Switch to light mode";
      btn.setAttribute("aria-label",
        isLight ? "Switch to dark mode" : "Switch to light mode");
    }

    updateButton();

    btn.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "light"
        ? "dark" : "light";
      document.documentElement.dataset.theme = next;
      localStorage.setItem("fasqoo-theme", next);
      updateButton();
    });
  });
})();

const $ = id => document.getElementById(id);
const SPEED_BASE = "https://speed.cloudflare.com";
let isRunning = false;
let abortTest = null;

window.addEventListener("DOMContentLoaded", () => {
  startSpeedTest();
  fetchIpInfo();
});

async function fetchIpInfo(){
  try{
    const res = await fetch("https://ipwho.is/", {
      cache: "no-store",
      headers: { "Accept": "application/json" }
    });
    if(!res.ok) throw new Error("IP lookup failed");
    const data = await res.json();
    $("ipVal").textContent = data.success && data.ip ? data.ip : "Unavailable";
  }catch(e){
    $("ipVal").textContent = "Unavailable";
  }
}

function createTimeout(ms, parentSignal){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  const abortParent = () => controller.abort();

  if(parentSignal){
    if(parentSignal.aborted) controller.abort();
    else parentSignal.addEventListener("abort", abortParent, {once:true});
  }

  return {
    signal: controller.signal,
    clear: () => {
      clearTimeout(timer);
      if(parentSignal) parentSignal.removeEventListener("abort", abortParent);
    }
  };
}

function formatMs(value){
  return Number.isFinite(value) && value >= 0 ? Math.round(value) : "—";
}

function formatJitter(value){
  return Number.isFinite(value) && value >= 0 ? value.toFixed(1) : "—";
}

function formatMbps(value){
  if(!Number.isFinite(value) || value < 0) return "—";
  return value < 10 ? value.toFixed(1) : Math.round(value);
}

function calculateJitter(samples){
  if(samples.length < 2) return 0;
  let total = 0;
  for(let i = 1; i < samples.length; i++){
    total += Math.abs(samples[i] - samples[i - 1]);
  }
  return total / (samples.length - 1);
}

async function measureLatency(signal){
  const samples = [];
  const attempts = 7;

  for(let i = 0; i < attempts; i++){
    if(signal.aborted) throw new DOMException("Test cancelled", "AbortError");

    const timer = createTimeout(3000, signal);
    const start = performance.now();

    try{
      const res = await fetch(
        SPEED_BASE + "/__down?bytes=0&r=" + crypto.randomUUID(),
        {
          method: "GET",
          signal: timer.signal,
          cache: "no-store",
          credentials: "omit"
        }
      );

      if(!res.ok) throw new Error("Latency request failed");
      await res.arrayBuffer();

      const elapsed = performance.now() - start;
      if(Number.isFinite(elapsed) && elapsed > 0) samples.push(elapsed);
    }catch(e){
      if(e.name === "AbortError" && signal.aborted) throw e;
    }finally{
      timer.clear();
    }
  }

  if(samples.length < 3) throw new Error("Not enough latency samples");

  // Remove the single lowest and highest sample when 5+ samples exist.
  const sorted = [...samples].sort((a,b) => a-b);
  const usable = sorted.length >= 5 ? sorted.slice(1, -1) : sorted;

  const ping = usable.reduce((a,b) => a+b, 0) / usable.length;
  const jitter = calculateJitter(usable);

  return { ping, jitter };
}

async function measureDownload(signal){
  const sizes = [1e6, 2e6, 5e6, 10e6, 20e6, 40e6, 80e6];
  const measurements = [];

  for(const size of sizes){
    if(signal.aborted) throw new DOMException("Test cancelled", "AbortError");

    const timer = createTimeout(12000, signal);
    const start = performance.now();

    try{
      const res = await fetch(
        SPEED_BASE + "/__down?bytes=" + size + "&r=" + crypto.randomUUID(),
        {
          method: "GET",
          signal: timer.signal,
          cache: "no-store",
          credentials: "omit"
        }
      );

      if(!res.ok) throw new Error("Download request failed");

      const buf = await res.arrayBuffer();
      const seconds = (performance.now() - start) / 1000;

      if(buf.byteLength <= 0 || seconds <= 0){
        throw new Error("Invalid download sample");
      }

      const speed = (buf.byteLength * 8) / seconds / 1e6;
      if(!Number.isFinite(speed) || speed <= 0){
        throw new Error("Invalid download speed");
      }

      measurements.push({bytes: buf.byteLength, seconds});
      $("speed").textContent = formatMbps(speed);
    }catch(e){
      if(e.name === "AbortError" && signal.aborted) throw e;
      // Failed samples are discarded. No fallback/fake value is used.
    }finally{
      timer.clear();
    }
  }

  if(!measurements.length) throw new Error("Download measurement failed");

  const totalBytes = measurements.reduce((sum,m) => sum + m.bytes, 0);
  const totalSeconds = measurements.reduce((sum,m) => sum + m.seconds, 0);

  return (totalBytes * 8) / totalSeconds / 1e6;
}

function makeRandomBytes(size){
  const data = new Uint8Array(size);
  // Random payload avoids a trivially compressible constant request body.
  crypto.getRandomValues(data);
  return data;
}

async function measureUpload(signal){
  const sizes = [500000, 1000000, 2500000, 5000000];
  const measurements = [];

  for(const size of sizes){
    if(signal.aborted) throw new DOMException("Test cancelled", "AbortError");

    const data = makeRandomBytes(size);
    const timer = createTimeout(12000, signal);
    const start = performance.now();

    try{
      const res = await fetch(
        SPEED_BASE + "/__up?r=" + crypto.randomUUID(),
        {
          method: "POST",
          body: data,
          signal: timer.signal,
          cache: "no-store",
          credentials: "omit",
          headers: {"Content-Type": "application/octet-stream"}
        }
      );

      if(!res.ok) throw new Error("Upload request failed");
      await res.arrayBuffer();

      const seconds = (performance.now() - start) / 1000;
      if(seconds <= 0) throw new Error("Invalid upload time");

      const speed = (size * 8) / seconds / 1e6;
      if(!Number.isFinite(speed) || speed <= 0){
        throw new Error("Invalid upload speed");
      }

      measurements.push({bytes: size, seconds});
    }catch(e){
      if(e.name === "AbortError" && signal.aborted) throw e;
      // Failed samples are discarded. No fallback/fake value is used.
    }finally{
      timer.clear();
    }
  }

  if(!measurements.length) throw new Error("Upload measurement failed");

  const totalBytes = measurements.reduce((sum,m) => sum + m.bytes, 0);
  const totalSeconds = measurements.reduce((sum,m) => sum + m.seconds, 0);

  return (totalBytes * 8) / totalSeconds / 1e6;
}

async function startSpeedTest(){
  if(isRunning) return;

  isRunning = true;
  abortTest = new AbortController();

  $("restartBtn").style.display = "none";
  $("detailsGrid").classList.remove("visible");
  $("speed").textContent = "0";
  $("unit").textContent = "Mbps";
  $("pingVal").innerHTML = "—<span>ms</span>";
  $("jitterVal").innerHTML = "—<span>ms</span>";
  $("upVal").innerHTML = "—<span>Mbps</span>";
  $("status").textContent = "Measuring latency...";

  try{
    const latency = await measureLatency(abortTest.signal);

    $("pingVal").innerHTML = formatMs(latency.ping) + "<span>ms</span>";
    $("jitterVal").innerHTML = formatJitter(latency.jitter) + "<span>ms</span>";

    $("status").textContent = "Measuring download...";
    const download = await measureDownload(abortTest.signal);
    $("speed").textContent = formatMbps(download);

    $("status").textContent = "Measuring upload...";
    const upload = await measureUpload(abortTest.signal);
    $("upVal").innerHTML = formatMbps(upload) + "<span>Mbps</span>";

    $("status").textContent = "Test complete";
    $("detailsGrid").classList.add("visible");
    $("restartBtn").style.display = "inline-block";
  }catch(err){
    console.error("Fasqoo speed test:", err);
    $("status").textContent =
      err.name === "AbortError"
        ? "Test cancelled."
        : "Measurement failed — no fallback values used.";
    $("detailsGrid").classList.add("visible");
    $("restartBtn").style.display = "inline-block";
  }finally{
    isRunning = false;
    abortTest = null;
  }
}

window.addEventListener("beforeunload", () => {
  if(abortTest) abortTest.abort();
});</script>

}
</script>
