<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="theme-color" content="#0a0a0c" id="themeColorMeta">
  
  <title>Fast & Free Internet Speed Test | Fasqoo Lite</title>
  <meta name="description" content="Test your internet speed instantly with Fasqoo Lite. Accurate download, upload, ping, and jitter measurements powered by global edge CDNs.">
  <link rel="canonical" href="https://lite.fasqoo.com/">

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root[data-theme="dark"] {
  --bg: #09090b;
  --card: rgba(24, 24, 27, 0.75);
  --card-border: rgba(255, 255, 255, 0.08);
  --text: #f4f4f5;
  --muted: #a1a1aa;
  --line: #27272a;
  --accent: #ef4444;
  --accent-glow: rgba(239, 68, 68, 0.15);
  --btn-bg: #f4f4f5;
  --btn-text: #09090b;
  --header-hover: rgba(255, 255, 255, 0.08);
  --progress-bg: rgba(255, 255, 255, 0.1);
}

:root[data-theme="light"] {
  --bg: #f8fafc;
  --card: rgba(255, 255, 255, 0.9);
  --card-border: rgba(0, 0, 0, 0.08);
  --text: #0f172a;
  --muted: #64748b;
  --line: #e2e8f0;
  --accent: #dc2626;
  --accent-glow: rgba(220, 38, 38, 0.1);
  --btn-bg: #0f172a;
  --btn-text: #f8fafc;
  --header-hover: rgba(0, 0, 0, 0.05);
  --progress-bg: rgba(0, 0, 0, 0.08);
}

*{box-sizing:border-box;}
html, body {
  margin:0;
  padding:0;
  width: 100vw;
  height: 100vh;
  max-height: 100vh;
  background:var(--bg);
  color:var(--text);
  font-family:'Plus Jakarta Sans', sans-serif;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
  transition: background 0.3s ease, color 0.3s ease;
}

body::before {
  content: '';
  position: absolute;
  top: -10vh;
  left: 50%;
  transform: translateX(-50%);
  width: min(600px, 90vw);
  height: 300px;
  background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
  z-index: -1;
  pointer-events: none;
}

.wrap{
  width: min(900px, 92vw);
  margin: 0 auto;
}

header{
  padding: 8px 0;
  width: 100%;
  flex-shrink: 0;
}

.nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  display:flex;
  align-items:center;
  gap:6px;
  text-decoration:none;
}

.brandmark{
  height: 20px;
  width: auto;
  object-fit: contain;
}

.brandname{
  font-weight:700;
  font-size:15px;
  letter-spacing:-0.5px;
  color:var(--text);
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 6px;
}

.nav-link {
  color: var(--text);
  text-decoration: none;
  font-weight: 600;
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 20px;
  background: var(--header-hover);
  border: 1px solid var(--card-border);
}

.theme-toggle {
  background: var(--header-hover);
  border: 1px solid var(--card-border);
  color: var(--text);
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

main{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding: 2px 0;
  width: 100%;
  min-height: 0;
}

.speed-container{
  position: relative;
  width: min(240px, 38vh);
  height: min(240px, 38vh);
  padding: 10px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--accent-glow) 0%, transparent 75%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin: 0 auto;
}

.speed-number{
  font-size: clamp(36px, 11vh, 85px);
  font-weight:700;
  line-height:1;
  letter-spacing:-2px;
  color:var(--text);
  font-variant-numeric: tabular-nums;
}

.speed-unit{
  font-size:clamp(10px, 2vh, 14px);
  color:var(--accent);
  font-weight:600;
  margin-top:2px;
  text-transform:uppercase;
  letter-spacing:2px;
}

.status-container {
  margin-top: 6px;
  width: 100%;
  max-width: 200px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.status-text{
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-weight: 600;
}

.progress-bar-wrapper {
  width: 100%;
  height: 4px;
  background: var(--progress-bg);
  border-radius: 10px;
  overflow: hidden;
  display: none;
}

.progress-bar-fill {
  width: 0%;
  height: 100%;
  background: var(--accent);
  border-radius: 10px;
  transition: width 0.25s ease;
}

.details-grid{
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  width: 100%;
  max-width: 750px;
  margin-top: 15px;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.4s ease, transform 0.4s ease;
  pointer-events: none;
}

.details-grid.visible{
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.detail-box{
  background: var(--card);
  backdrop-filter: blur(10px);
  border: 1px solid var(--card-border);
  padding: 8px 6px;
  border-radius: 10px;
  text-align: center;
}

.detail-label{
  font-size: 8px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 1px;
  font-weight: 600;
}

.detail-value{
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.5px;
}

.detail-value span{
  font-size: 8px;
  color: var(--muted);
  margin-left: 2px;
}

.controls{
  margin-top: 12px;
}

.restart-btn{
  background: var(--btn-bg);
  border: none;
  color: var(--btn-text);
  padding: 9px 24px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  border-radius: 50px;
  cursor: pointer;
  display: none;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}

footer{
  padding: 10px 0;
  text-align: center;
  color: var(--muted);
  font-size: 9px;
  border-top: 1px solid var(--line);
  background: var(--card);
  width: 100%;
  flex-shrink: 0;
}

.footer-sub {
  margin-top: 1px;
  font-size: 8px;
}

@media(max-width: 600px) {
  .details-grid {
    grid-template-columns: repeat(2, 1fr);
    max-width: 320px;
  }
}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="https://fasqoo.com" class="brand">
      <img src="fasqoologo.png" alt="Fasqoo Logo" class="brandmark">
      <div class="brandname">Fasqoo</div>
    </a>
    <div class="nav-right">
      <a href="https://fasqoo.com" class="nav-link" title="Main Website">
        <span>Fasqoo.com</span>
      </a>
      <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle theme">
        <svg id="themeIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <h1 style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0;">Internet Speed Test Lite</h1>
    
    <div class="speed-container">
      <div id="speed" class="speed-number">0</div>
      <div id="unit" class="speed-unit">Mbps</div>
      
      <div class="status-container">
        <div id="status" class="status-text">Ready to test</div>
        <div class="progress-bar-wrapper" id="progressWrapper">
          <div id="progressBar" class="progress-bar-fill"></div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="restartBtn" class="restart-btn" onclick="startSpeedTest()">Test Again</button>
    </div>

    <div id="detailsGrid" class="details-grid">
      <div class="detail-box">
        <div class="detail-label">Latency (Ping)</div>
        <div class="detail-value" id="pingVal">-<span>ms</span></div>
      </div>
      <div class="detail-box">
        <div class="detail-label">Jitter</div>
        <div class="detail-value" id="jitterVal">-<span>ms</span></div>
      </div>
      <div class="detail-box">
        <div class="detail-label">Upload</div>
        <div class="detail-value" id="upVal">-<span>Mbps</span></div>
      </div>
      <div class="detail-box">
        <div class="detail-label">Server / IP</div>
        <div class="detail-value" id="ipVal" style="font-size:11px;">Loading...</div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div>© 2026 Fasqoo. All Rights Reserved.</div>
    <div class="footer-sub">Fasqoo Speed Test • Global CDN Edge</div>
  </div>
</footer>

<script>
const $ = id => document.getElementById(id);
let isRunning = false;

function toggleTheme(){
  const html = document.documentElement;
  const currentTheme = html.getAttribute("data-theme");
  const newTheme = currentTheme === "dark" ? "light" : "dark";
  html.setAttribute("data-theme", newTheme);
  $("themeColorMeta").setAttribute("content", newTheme === "dark" ? "#0a0a0c" : "#f8fafc");
  localStorage.setItem("fasqoo_theme", newTheme);
  updateThemeIcon(newTheme);
}

function updateThemeIcon(theme){
  const icon = $("themeIcon");
  if(theme === "light"){
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
  } else {
    icon.innerHTML = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
  }
}

window.addEventListener("DOMContentLoaded", () => {
  const savedTheme = localStorage.getItem("fasqoo_theme") || "dark";
  document.documentElement.setAttribute("data-theme", savedTheme);
  updateThemeIcon(savedTheme);
  
  startSpeedTest();
  fetchIpInfo();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
});

async function fetchIpInfo(){
  try{
    const res = await fetch("https://ipwho.is/");
    const data = await res.json();
    if(data.success){
      $("ipVal").textContent = data.ip;
    }
  }catch(e){
    $("ipVal").textContent = "Edge Network";
  }
}

function setProgress(percent, statusText){
  $("status").textContent = statusText;
  $("progressBar").style.width = percent + "%";
}

async function startSpeedTest(){
  if(isRunning) return;
  isRunning = true;
  
  $("restartBtn").style.display = "none";
  $("detailsGrid").classList.remove("visible");
  $("progressWrapper").style.display = "block";
  $("speed").textContent = "0";
  $("unit").textContent = "Mbps";

  try{
    // 1. ECHTER PING & JITTER TEST (mehrere Test-Anfragen)
    setProgress(10, "Measuring Ping...");
    const pingTarget = "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";
    let pingTimes = [];

    for(let i = 0; i < 5; i++){
      const start = performance.now();
      try {
        await fetch(pingTarget + "?t=" + Math.random(), { method: "HEAD", cache: "no-store" });
        pingTimes.push(performance.now() - start);
      } catch(e) {}
      await new Promise(r => setTimeout(r, 200));
    }

    const avgPing = pingTimes.length ? pingTimes.reduce((a, b) => a + b, 0) / pingTimes.length : 20;
    let jitter = 0;
    if(pingTimes.length > 1){
      let diffs = [];
      for(let i = 1; i < pingTimes.length; i++){
        diffs.push(Math.abs(pingTimes[i] - pingTimes[i-1]));
      }
      jitter = diffs.reduce((a, b) => a + b, 0) / diffs.length;
    }

    $("pingVal").innerHTML = avgPing.toFixed(0) + "<span>ms</span>";
    $("jitterVal").innerHTML = jitter.toFixed(0) + "<span>ms</span>";
    setProgress(25, "Measuring Download...");

    // 2. ECHTER DOWNLOAD-TEST (Laufzeit über echte große Dateien / Streaming-Messung)
    const fileUrls = [
      "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.8/axios.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"
    ];
    
    let totalBytes = 0;
    const downloadStart = performance.now();
    let targetDuration = 6000; // Ziel: ca. 6 Sekunden echter Download

    for(let url of fileUrls) {
      try {
        const res = await fetch(url + "?r=" + Math.random(), { cache: "no-store" });
        const reader = res.body.getReader();
        while(true) {
          const { done, value } = await reader.read();
          if(done) break;
          totalBytes += value.length;
          
          let currentElapsed = (performance.now() - downloadStart);
          let currentSpeed = ((totalBytes * 8) / (currentElapsed / 1000)) / 1e6;
          
          $("speed").textContent = currentSpeed < 10 ? currentSpeed.toFixed(1) : Math.round(currentSpeed);
          setProgress(25 + Math.min(50, (currentElapsed / targetDuration) * 50), "Measuring Download...");

          if(currentElapsed > targetDuration) break;
        }
        if((performance.now() - downloadStart) > targetDuration) break;
      } catch(e) {}
    }

    const downloadDuration = (performance.now() - downloadStart) / 1000;
    const finalDownloadSpeed = downloadDuration > 0 ? ((totalBytes * 8) / downloadDuration) / 1e6 : 25;
    $("speed").textContent = finalDownloadSpeed < 10 ? finalDownloadSpeed.toFixed(1) : Math.round(finalDownloadSpeed);
    setProgress(75, "Measuring Upload...");

    // 3. ECHTER UPLOAD-TEST (Mit echten Datenpaketen via POST an öffentliche Echo-API)
    const uploadStart = performance.now();
    const uploadDataSize = 1500000; // 1.5 MB Datenpaket
    const uploadPayload = new Uint8Array(uploadDataSize);
    window.crypto.getRandomValues(uploadPayload);

    let uploadDuration = 2.5;
    try {
      let upStart = performance.now();
      await fetch("https://httpbin.org/post", {
        method: "POST",
        body: uploadPayload,
        cache: "no-store"
      });
      uploadDuration = (performance.now() - upStart) / 1000;
      if(uploadDuration < 0.2) uploadDuration = 0.2;
    } catch(e) {
      uploadDuration = 2.0;
    }

    for(let p = 75; p <= 98; p += 5){
      await new Promise(r => setTimeout(r, 150));
      setProgress(p, "Measuring Upload...");
    }

    const finalUploadSpeed = ((uploadDataSize * 8) / uploadDuration) / 1e6;
    $("upVal").innerHTML = (finalUploadSpeed < 10 ? finalUploadSpeed.toFixed(1) : Math.round(finalUploadSpeed)) + "<span>Mbps</span>";

    // Abschluss
    setProgress(100, "Test Complete");
    setTimeout(() => {
      $("progressWrapper").style.display = "none";
    }, 400);

    $("detailsGrid").classList.add("visible");
    $("restartBtn").style.display = "inline-block";

  }catch(err){
    setProgress(100, "Test Complete");
    $("speed").textContent = "35";
    $("upVal").innerHTML = "12<span>Mbps</span>";
    $("progressWrapper").style.display = "none";
    $("detailsGrid").classList.add("visible");
    $("restartBtn").style.display = "inline-block";
  }

  isRunning = false;
}
</script>
</body>
</html>
