<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff5a1f">
<title>Fasqoo Speed Test Widget</title>
<style>
:root{
  --bg:#07090d;
  --panel:#0f141b;
  --panel2:#121922;
  --text:#f7f8fa;
  --muted:#8d98a6;
  --line:rgba(255,255,255,.09);
  --accent:#ff5a1f;
  --accent2:#ff7a45;
  --good:#4ade80;
  --shadow:0 20px 60px rgba(0,0,0,.32);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:transparent;color:var(--text)}
.widget{
  width:min(760px,100%);
  margin:0 auto;
  padding:18px;
}
.card{
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:26px;
  background:linear-gradient(145deg,var(--panel),var(--panel2));
  box-shadow:var(--shadow);
}
.card:before{
  content:"";
  position:absolute;inset:-120px auto auto -80px;
  width:280px;height:280px;
  border-radius:50%;
  background:rgba(255,90,31,.12);
  filter:blur(50px);
  pointer-events:none;
}
.top{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:16px 18px;
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:46px;height:46px;border-radius:13px;display:block;object-fit:cover}
.brand strong{display:block;font-size:16px;letter-spacing:-.02em}
.brand span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.main{position:relative;padding:24px 20px 20px}
.status{text-align:center;color:var(--muted);font-size:13px;min-height:20px}
.gauge{
  width:min(260px,68vw);
  aspect-ratio:1;
  margin:16px auto 20px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at center,var(--panel) 0 58%,transparent 59%),
    conic-gradient(var(--accent) var(--progress,0%),rgba(255,255,255,.07) 0);
  box-shadow:inset 0 0 35px rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.04);
  transition:background .18s ease;
}
.gauge-inner{text-align:center}
.speed{font-size:clamp(34px,8vw,58px);font-weight:800;line-height:1;letter-spacing:-.05em}
.unit{font-size:13px;color:var(--muted);margin-top:8px}
.phase{font-size:11px;color:var(--accent2);margin-top:8px;min-height:15px}
button{
  font:inherit;
  cursor:pointer;
  border:0;
}
.start{
  display:block;width:min(300px,100%);margin:0 auto;
  padding:14px 22px;border-radius:14px;
  color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-weight:800;font-size:14px;letter-spacing:.02em;
  box-shadow:0 12px 28px rgba(255,90,31,.22);
  transition:transform .15s ease,opacity .15s ease;
}
.start:hover{transform:translateY(-1px)}
.start:disabled{opacity:.55;cursor:wait;transform:none}
.metrics{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:10px;margin-top:18px;
}
.metric{
  min-width:0;padding:14px;border:1px solid var(--line);
  border-radius:16px;background:rgba(255,255,255,.025);
}
.metric label{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}
.metric b{font-size:18px;letter-spacing:-.02em}
.metric small{color:var(--muted);font-size:10px;margin-left:2px}
.info{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;
}
.info .metric{grid-column:span 1}
.footer{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 18px;border-top:1px solid var(--line);
  color:var(--muted);font-size:10px;
}
.footer a{color:var(--text);text-decoration:none}
.footer a:hover{text-decoration:underline}
.error{color:#ff8c8c}
@media(max-width:520px){
  .widget{padding:8px}
  .top{padding:13px 14px}
  .main{padding:20px 13px 15px}
  .metrics{grid-template-columns:repeat(2,1fr)}
  .metric:last-child{grid-column:span 2}
  .info{grid-template-columns:1fr}
  .info .metric{grid-column:span 1}
}
</style>
</head>

  let running = false;
  let aborter = null;

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function fmt(n, digits=1){
    if (!Number.isFinite(n)) return "—";
    if (n >= 1000) return n.toFixed(0);
    if (n >= 100) return n.toFixed(0);
    if (n >= 10) return n.toFixed(digits);
    return n.toFixed(Math.min(2,digits+1));
  }

  function setProgress(v){
    const p = Math.max(0, Math.min(100, v));
    els.gauge.style.setProperty("--progress", p + "%");
  }

  function showSpeed(v){
    els.speed.textContent = Number.isFinite(v) ? fmt(v,1) : "0";
    // Logarithmic visual scale so both low and high speeds remain visible.
    const progress = Number.isFinite(v) && v > 0
      ? Math.min(100, Math.log10(v + 1) / Math.log10(1001) * 100)
      : 0;
    setProgress(progress);
  }

  async function timedFetch(url, options={}, timeout=20000){
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);
    const signal = options.signal || controller.signal;
    try{
      return await fetch(url, {...options, signal, cache:"no-store"});
    }finally{
      clearTimeout(timer);
    }
  }

  async function pingTest(signal){
    const samples = [];
    for(let i=0;i<7;i++){
      if(signal.aborted) throw new DOMException("Aborted","AbortError");
      const u = DOWN + "?bytes=0&r=" + Date.now() + "-" + i + "-" + Math.random().toString(36).slice(2);
      const t = performance.now();
      const response = await fetch(u, {cache:"no-store", signal});
      if(!response.ok) throw new Error("Latency request failed");
      await response.arrayBuffer();
      const ms = performance.now() - t;
      if(ms > 0 && ms < 5000) samples.push(ms);
      await sleep(40);
    }
    if(!samples.length) throw new Error("No latency samples");
    const sorted = [...samples].sort((a,b)=>a-b);
    const median = sorted[Math.floor(sorted.length/2)];
    let deltas = [];
    for(let i=1;i<samples.length;i++) deltas.push(Math.abs(samples[i]-samples[i-1]));
    const jitter = deltas.length ? deltas.reduce((a,b)=>a+b,0)/deltas.length : 0;
    return {ping:median, jitter};
  }

  async function downloadSample(bytes, signal){
    const url = DOWN + "?bytes=" + bytes + "&r=" + Date.now() + "-" + Math.random().toString(36).slice(2);
    const t0 = performance.now();
    const response = await fetch(url, {cache:"no-store", signal});
    if(!response.ok) throw new Error("Download request failed (" + response.status + ")");
    const body = response.body;

    let received = 0;
    if(body && body.getReader){
      const reader = body.getReader();
      while(true){
        const {done,value} = await reader.read();
        if(done) break;
        received += value.byteLength;
      }
    }else{
      const buf = await response.arrayBuffer();
      received = buf.byteLength;
    }
    const seconds = (performance.now()-t0)/1000;
    if(seconds <= 0 || received <= 0) throw new Error("Invalid download sample");
    return (received*8/seconds)/1e6;
  }

  function makePayload(bytes){
    // Reuse one small buffer pattern. This avoids huge crypto.getRandomValues()
    // allocations and is safe for browser entropy limits.
    const chunk = new Uint8Array(1024*1024);
    for(let i=0;i<chunk.length;i+=4){
      chunk[i]=70; chunk[i+1]=97; chunk[i+2]=115; chunk[i+3]=113;
    }
    const parts=[];
    let left=bytes;
    while(left>0){
      const n=Math.min(left,chunk.length);
      parts.push(n===chunk.length ? chunk : chunk.slice(0,n));
      left-=n;
    }
    return new Blob(parts,{type:"application/octet-stream"});
  }

  async function uploadSample(bytes, signal){
    const payload = makePayload(bytes);
    const t0 = performance.now();
    const response = await fetch(UP + "?r=" + Date.now() + "-" + Math.random().toString(36).slice(2), {
      method:"POST",
      body:payload,
      cache:"no-store",
      headers:{"Content-Type":"application/octet-stream"},
      signal
    });
    if(!response.ok) throw new Error("Upload request failed (" + response.status + ")");
    // Wait for the response so the measured request is complete.
    try { await response.arrayBuffer(); } catch(_){}
    const seconds=(performance.now()-t0)/1000;
    if(seconds<=0) throw new Error("Invalid upload sample");
    return (bytes*8/seconds)/1e6;
  }

  async function ramp(direction, signal){
    // Progressive sizing: small warm-up, then larger samples for stable results.
    const sizes = [1e6,5e6,15e6,30e6];
    const results=[];
    for(let i=0;i<sizes.length;i++){
      const mb=Math.round(sizes[i]/1e6);
      els.phase.textContent = (direction==="download" ? "Downloading " : "Uploading ") + mb + " MB";
      const v = direction==="download"
        ? await downloadSample(sizes[i],signal)
        : await uploadSample(sizes[i],signal);
      results.push(v);
      showSpeed(v);

      // Once a larger sample is long enough, avoid wasting bandwidth.
      if(i>=2){
        const prev = results[results.length-2];
        if(Number.isFinite(prev) && prev < 8) break;
      }
    }
    if(!results.length) throw new Error("No " + direction + " samples");
    // The final two samples represent the stabilized phase.
    const tail = results.length>=2 ? results.slice(-2) : results;
    return tail.reduce((a,b)=>a+b,0)/tail.length;
  }

  async function metadata(){
    try{
      const r = await timedFetch(META,{method:"GET"},7000);
      if(!r.ok) return;
      const m = await r.json();
      const bits = [];
      if(m.clientIp) bits.push(m.clientIp);
      if(m.colo) bits.push(m.colo);
      if(m.asOrganization) bits.push(m.asOrganization);
      els.server.textContent = bits.length ? bits.join(" · ") : "Cloudflare Edge";
    }catch(_){
      els.server.textContent = "Cloudflare Edge";
    }
  }

  async function run(){
    if(running) return;
    running=true;
    aborter=new AbortController();
    els.start.disabled=true;
    els.start.textContent="TESTING…";
    els.status.classList.remove("error");
    els.download.textContent="—";
    els.upload.textContent="—";
    els.ping.textContent="—";
    els.jitter.textContent="—";
    showSpeed(0);

    try{
      metadata();

      els.status.textContent="Measuring latency";
      els.phase.textContent="Ping";
      const latency = await pingTest(aborter.signal);
      els.ping.textContent=fmt(latency.ping,1);
      els.jitter.textContent=fmt(latency.jitter,1);

      els.status.textContent="Measuring download";
      const down = await ramp("download",aborter.signal);
      els.download.textContent=fmt(down,1);

      els.status.textContent="Measuring upload";
      const up = await ramp("upload",aborter.signal);
      els.upload.textContent=fmt(up,1);

      const peak=Math.max(down,up);
      showSpeed(peak);
      els.phase.textContent="Complete";
      els.status.textContent="Test complete";
    }catch(err){
      if(err && err.name==="AbortError"){
        els.status.textContent="Test cancelled";
      }else{
        els.status.textContent="Test could not be completed";
        els.status.classList.add("error");
        els.phase.textContent="Try again";
        console.error(err);
      }
    }finally{
      running=false;
      aborter=null;
      els.start.disabled=false;
      els.start.textContent="TEST AGAIN";
    }
  }

  els.start.addEventListener("click",run);
  metadata();
})();
</script>
</body>
</html>
